[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supportsense-ai"
version = "0.1.0"
description = "Tenant-isolated AI support-ticket analytics with cited insights."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["app*", "supportsense*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
cache_dir = ".pytest_cache"
addopts = ["--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
