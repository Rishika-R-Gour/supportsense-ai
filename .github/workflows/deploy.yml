name: Deploy Production Architecture (Paid)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [staging, production]
      confirm_paid_architecture:
        description: This deploys ECS/RDS/ALB/NAT resources that can consume credits
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: supportsense-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm_paid_architecture
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check .
      - run: pytest -q
        env:
          SUPPORTSENSE_ENV: test
          SUPPORTSENSE_API_KEYS: test-admin-key:test-tenant:admin
      - run: python scripts/run_production_evals.py
      - run: python scripts/verify_roadmap.py
      - run: pip-audit --vulnerability-service osv -r requirements-production.lock
      - run: pip-audit --vulnerability-service osv -r requirements-frontend.lock
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform
      - run: terraform init -backend=false
        working-directory: infra/terraform-free
      - run: terraform validate
        working-directory: infra/terraform-free

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build immutable API and frontend images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --pull -t "$REGISTRY/supportsense-api:$IMAGE_TAG" .
          docker build --pull -f Dockerfile.frontend \
            -t "$REGISTRY/supportsense-frontend:$IMAGE_TAG" .

      - name: Scan API image before registry push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/supportsense-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image before registry push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/supportsense-frontend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push scanned immutable images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$REGISTRY/supportsense-api:$IMAGE_TAG"
          docker push "$REGISTRY/supportsense-frontend:$IMAGE_TAG"

      - name: Download current task definition
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          task_definition=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          aws ecs describe-task-definition \
            --task-definition "$task_definition" \
            --query taskDefinition > task-definition.json
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-definition.json > deploy-task-definition.json

      - id: api-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy-task-definition.json
          container-name: api
          image: ${{ steps.ecr.outputs.registry }}/supportsense-api:${{ github.sha }}

      - id: frontend-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.api-task.outputs.task-definition }}
          container-name: frontend
          image: ${{ steps.ecr.outputs.registry }}/supportsense-frontend:${{ github.sha }}

      - name: Run database migrations as a one-off ECS task
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
          TASK_DEFINITION: ${{ steps.frontend-task.outputs.task-definition }}
        run: |
          jq '
            .family = (.family + "-migration")
            | .cpu = "1024"
            | .memory = "2048"
            | .containerDefinitions = [
                .containerDefinitions[]
                | select(.name == "api")
                | .command = ["alembic", "upgrade", "head"]
                | del(.healthCheck)
              ]
          ' "$TASK_DEFINITION" > migration-task-definition.json
          migration_definition=$(aws ecs register-task-definition \
            --cli-input-json file://migration-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          network_configuration=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].networkConfiguration' \
            --output json)
          migration_task=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$migration_definition" \
            --launch-type FARGATE \
            --network-configuration "$network_configuration" \
            --query 'tasks[0].taskArn' \
            --output text)
          test "$migration_task" != "None"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$migration_task"
          exit_code=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" \
            --tasks "$migration_task" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          test "$exit_code" = "0"

      - name: Deploy with ECS rollback enabled
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend-task.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Post-deploy authenticated smoke test
        env:
          SERVICE_BASE_URL: ${{ vars.SERVICE_BASE_URL }}
          SMOKE_TEST_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}
        run: |
          python scripts/smoke_test.py \
            --base-url "$SERVICE_BASE_URL" \
            --token "$SMOKE_TEST_TOKEN"
